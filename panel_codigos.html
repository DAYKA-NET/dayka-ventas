<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Códigos · Dayka (uso interno)</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --plum:#4E1837;
    --plum-deep:#3A1029;
    --rose:#D6336C;
    --rose-soft:#F8E3EB;
    --blush:#FBF5F7;
    --ink:#2E2230;
    --ink-soft:#7A6675;
    --white:#FFFFFF;
    --green:#1FA855;
    --green-soft:#E4F5EA;
    --amber:#B7791F;
    --amber-soft:#FDF3E0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--blush);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,var(--plum-deep),var(--plum) 60%,#6B2149);
    color:var(--white);
    padding:22px 16px 18px;
    border-radius:0 0 26px 26px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header h1{font-size:1.25rem;font-weight:800;}
  header h1 span{color:#F7A8C4;}
  header p{font-size:.78rem;opacity:.8;margin-top:4px;}
  .stats{display:flex;gap:10px;margin-top:14px;}
  .stat{flex:1;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px;text-align:center;}
  .stat .num{font-size:1.2rem;font-weight:800;}
  .stat .lbl{font-size:.66rem;opacity:.85;margin-top:2px;}

  .filters{max-width:720px;margin:14px auto 0;padding:0 14px;display:flex;gap:6px;}
  .chip{flex:1;border:none;background:var(--white);color:var(--ink-soft);font-weight:700;font-size:.76rem;padding:9px 6px;border-radius:999px;cursor:pointer;box-shadow:0 2px 6px rgba(78,24,55,.08);}
  .chip.active{background:var(--rose);color:var(--white);}

  main{max-width:720px;margin:14px auto 0;padding:0 14px;}
  .card{
    background:var(--white);
    border-radius:16px;
    padding:14px;
    margin-bottom:10px;
    box-shadow:0 2px 10px rgba(78,24,55,.07);
  }
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .codigo{font-family:"Courier New",monospace;font-weight:800;font-size:1rem;color:var(--plum);letter-spacing:.5px;}
  .badge{font-size:.66rem;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
  .badge.disp{background:var(--green-soft);color:var(--green);}
  .badge.usado{background:var(--amber-soft);color:var(--amber);}
  .meta{font-size:.72rem;color:var(--ink-soft);margin-top:4px;}
  .meta.visita{color:var(--rose);font-weight:700;margin-top:6px;}
  .campos{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .campo{flex:1;min-width:130px;}
  .campo label{display:block;font-size:.66rem;font-weight:700;color:var(--ink-soft);margin-bottom:3px;}
  .campo input{
    width:100%;
    border:1.5px solid #E8D8E0;
    border-radius:9px;
    padding:8px 9px;
    font-size:.85rem;
    background:var(--blush);
  }
  .campo input:focus{outline:none;border-color:var(--rose);}
  .guardar-msg{font-size:.68rem;color:var(--green);font-weight:700;margin-top:6px;display:none;}

  .lock{position:fixed;inset:0;background:linear-gradient(150deg,var(--plum-deep),var(--plum));display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
  .lock-box{text-align:center;width:100%;max-width:320px;}
  .lock-emoji{font-size:2.4rem;margin-bottom:8px;}
  .lock-box h2{color:var(--white);font-size:1.1rem;font-weight:800;margin-bottom:14px;}
  .lock-box input{width:100%;text-align:center;font-size:1rem;letter-spacing:1.5px;border:none;border-radius:14px;padding:13px;outline:none;background:rgba(255,255,255,.95);text-transform:uppercase;}
  .lock-btn{width:100%;margin-top:12px;padding:13px;font-size:.9rem;font-weight:800;border:none;border-radius:999px;background:var(--rose);color:var(--white);cursor:pointer;}
  .lock-err{display:none;color:#FFB4B4;font-size:.78rem;font-weight:700;margin-top:10px;}

  .empty{text-align:center;color:var(--ink-soft);font-size:.9rem;padding:40px 20px;}
  .loading{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:40px 20px;}
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lock-box">
    <div class="lock-emoji">🔐</div>
    <h2>Panel de Códigos — solo Dayka</h2>
    <input id="adminPass" type="password" placeholder="Contraseña de administradora" autocomplete="off">
    <button class="lock-btn" onclick="entrarPanel()">Entrar ✓</button>
    <div class="lock-err" id="lockErr">Contraseña incorrecta 😅</div>
  </div>
</div>

<div id="panel" style="display:none;">
  <header>
    <div class="wrap">
      <h1>Panel de <span>Códigos</span> 🗝️</h1>
      <p>Estado en vivo de tus 50 códigos de acceso</p>
      <div class="stats">
        <div class="stat"><div class="num" id="stDisp">–</div><div class="lbl">Disponibles</div></div>
        <div class="stat"><div class="num" id="stUsado">–</div><div class="lbl">Ya usados</div></div>
        <div class="stat"><div class="num" id="stTotal">–</div><div class="lbl">Total</div></div>
      </div>
    </div>
  </header>

  <div class="filters">
    <button class="chip active" data-f="todos" onclick="setFiltro(this)">Todos</button>
    <button class="chip" data-f="disponible" onclick="setFiltro(this)">Disponibles</button>
    <button class="chip" data-f="usado" onclick="setFiltro(this)">Usados</button>
  </div>

  <main id="lista">
    <div class="loading">Cargando tus códigos...</div>
  </main>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB9eeZtwW255nouA-i0-l1OKCrFL_E2eFA",
    authDomain: "dayka-kit.firebaseapp.com",
    databaseURL: "https://dayka-kit-default-rtdb.firebaseio.com",
    projectId: "dayka-kit",
    storageBucket: "dayka-kit.firebasestorage.app",
    messagingSenderId: "613646064616",
    appId: "1:613646064616:web:335c5bcf2d8ae77dabe25d"
  };
  firebase.initializeApp(firebaseConfig);
  const dbDayka = firebase.database();

  const ADMIN_PASS = "DAYKA-PANEL-2026";
  const ADMIN_LOCK_KEY = "panel_admin_dayka";

  function entrarPanel(){
    const v = document.getElementById("adminPass").value.trim();
    if(v === ADMIN_PASS){
      try{ localStorage.setItem(ADMIN_LOCK_KEY, "1"); }catch(e){}
      mostrarPanel();
    }else{
      document.getElementById("lockErr").style.display = "block";
    }
  }
  document.addEventListener("keydown", e=>{
    if(e.key==="Enter" && document.getElementById("lock").style.display !== "none") entrarPanel();
  });
  function mostrarPanel(){
    document.getElementById("lock").style.display = "none";
    document.getElementById("panel").style.display = "block";
    iniciarPanel();
  }

  let codigosData = {};
  let asignData = {};
  let filtroActivo = "todos";
  let iniciado = false;

  function iniciarPanel(){
    if(iniciado) return;
    iniciado = true;
    dbDayka.ref("codigos").on("value", function(snap){
      codigosData = snap.val() || {};
      render();
    });
    dbDayka.ref("asignaciones").on("value", function(snap){
      asignData = snap.val() || {};
      render();
    });
  }

  function setFiltro(btn){
    filtroActivo = btn.dataset.f;
    document.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
  }

  function fmtFecha(iso){
    if(!iso) return "";
    try{
      const d = new Date(iso);
      return d.toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}) +
             " " + d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
    }catch(e){ return iso; }
  }

  function render(){
    const lista = document.getElementById("lista");
    const codigos = Object.keys(codigosData).sort();

    const disponibles = codigos.filter(c => codigosData[c].usado !== true);
    const usados = codigos.filter(c => codigosData[c].usado === true);
    document.getElementById("stDisp").textContent = disponibles.length;
    document.getElementById("stUsado").textContent = usados.length;
    document.getElementById("stTotal").textContent = codigos.length;

    let visibles = codigos;
    if(filtroActivo === "disponible") visibles = disponibles;
    if(filtroActivo === "usado") visibles = usados;

    if(codigos.length === 0){
      lista.innerHTML = '<div class="empty">Aún no hay códigos sembrados en Firebase 😊</div>';
      return;
    }
    if(visibles.length === 0){
      lista.innerHTML = '<div class="empty">No hay códigos en este filtro.</div>';
      return;
    }

    lista.innerHTML = "";
    visibles.forEach(c => {
      const info = codigosData[c] || {};
      const asign = asignData[c] || {};
      const usado = info.usado === true;

      const card = document.createElement("div");
      card.className = "card";

      const metaTxt = usado
        ? "Usado el " + fmtFecha(info.fecha)
        : "Disponible, sin usar todavía";

      let visitaTxt = "";
      if(usado){
        if(asign.ultima_visita){
          const dias = Math.floor((Date.now() - new Date(asign.ultima_visita).getTime()) / 86400000);
          const cuando = dias <= 0 ? "hoy" : dias === 1 ? "ayer" : "hace " + dias + " días";
          const alerta = dias >= 10 ? " ⚠️" : "";
          visitaTxt = '<div class="meta visita">📲 Última vez que entró: ' + cuando + alerta + '</div>';
        }else{
          visitaTxt = '<div class="meta visita">📲 Aún no ha abierto el Generador ni el Control</div>';
        }
      }

      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="codigo">${c}</div>
            <div class="meta">${metaTxt}</div>
            ${visitaTxt}
          </div>
          <span class="badge ${usado ? 'usado' : 'disp'}">${usado ? '🔴 USADO' : '🟢 DISPONIBLE'}</span>
        </div>
        <div class="campos">
          <div class="campo">
            <label>Cliente asignado</label>
            <input type="text" data-codigo="${c}" data-campo="clienta" value="${(asign.clienta||"").replace(/"/g,'&quot;')}" placeholder="Nombre del cliente">
          </div>
          <div class="campo">
            <label>Fecha que se lo diste</label>
            <input type="date" data-codigo="${c}" data-campo="fecha_asignada" value="${asign.fecha_asignada||""}">
          </div>
        </div>
        <div class="guardar-msg" id="msg-${c}">Guardado ✓</div>
      `;
      lista.appendChild(card);
    });

    lista.querySelectorAll("input[data-campo]").forEach(inp=>{
      inp.addEventListener("change", guardarAsignacion);
    });
  }

  let guardarTimers = {};
  function guardarAsignacion(ev){
    const el = ev.target;
    const codigo = el.dataset.codigo;
    const campo = el.dataset.campo;
    const valor = el.value;
    if(!asignData[codigo]) asignData[codigo] = {};
    asignData[codigo][campo] = valor;

    clearTimeout(guardarTimers[codigo]);
    guardarTimers[codigo] = setTimeout(()=>{
      dbDayka.ref("asignaciones/" + codigo).update({[campo]: valor}).then(()=>{
        const msg = document.getElementById("msg-" + codigo);
        if(msg){
          msg.style.display = "block";
          setTimeout(()=>{ msg.style.display = "none"; }, 1800);
        }
      }).catch(()=>{
        alert("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
      });
    }, 400);
  }

  // Recordar sesion de administradora en este dispositivo
  try{
    if(localStorage.getItem(ADMIN_LOCK_KEY) === "1") mostrarPanel();
  }catch(e){}
</script>
</body>
</html>
